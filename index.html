    <style>
        :root {
            --plum: #482b43;
            --muted: #654b61;
            --gold: #aa7952;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            width: 100%;
            color: var(--plum);
            font-family: 'DM Sans', sans-serif;
        }

        .birthday-page {
            position: relative;
            isolation: isolate;
            display: grid;
            place-items: center;
            width: 100%;
            min-height: calc(100 * min(var(--vh, 1vh), 1vh));
            overflow: hidden;
            padding: clamp(24px, 6vw, 72px) 18px;
            background:
                radial-gradient(circle at 14% 20%, rgba(245, 208, 222, .62), transparent 35%),
                radial-gradient(circle at 84% 78%, rgba(223, 211, 246, .65), transparent 38%);
        }

        .birthday-page::before,
        .birthday-page::after {
            content: "";
            position: absolute;
            z-index: -1;
            width: min(38vw, 380px);
            aspect-ratio: 1;
            border: 1px solid rgba(170, 121, 82, .13);
            border-radius: 50%;
            pointer-events: none;
        }

        .birthday-page::before {
            top: -19%;
            right: -8%;
        }

        .birthday-page::after {
            bottom: -23%;
            left: -8%;
        }

        .experience {
            position: relative;
            width: 100%;
            max-width: 780px;
            text-align: center;
        }

        .panel {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: clamp(38px, 7vw, 78px) clamp(23px, 7vw, 75px);
            border: 1px solid rgba(255, 255, 255, .9);
            border-radius: clamp(26px, 4vw, 42px);
            background: rgba(255, 255, 255, .78);
            box-shadow: 0 26px 80px rgba(93, 57, 85, .10), inset 0 1px 0 #fff;
            backdrop-filter: blur(14px);
        }

        .panel[hidden],
        [hidden] {
            display: none !important;
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(179, 142, 114, .15);
            border-radius: inherit;
            pointer-events: none;
        }

        .eyebrow {
            margin: 0 0 23px;
            color: var(--gold);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .25em;
            text-transform: uppercase;
        }

        h1,
        h2,
        p {
            position: relative;
        }

        .birthday-title {
            margin: 0 auto;
            max-width: 640px;
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.6rem, 6.5vw, 4.7rem);
            font-weight: 500;
            line-height: 1.17;
            letter-spacing: -.045em;
            text-wrap: balance;
        }

        .birthday-copy {
            max-width: 490px;
            margin: 24px auto 0;
            font-size: clamp(1rem, 2vw, 1.16rem);
            line-height: 1.8;
        }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 30px auto;
            color: var(--gold);
            font-size: 15px;
        }

        .ornament::before,
        .ornament::after {
            content: "";
            width: 42px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c6a687);
        }

        .ornament::after {
            transform: rotate(180deg);
        }

        .button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            padding: 14px 27px;
            border: 0;
            border-radius: 999px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            cursor: pointer;
            transition: transform .25s ease, box-shadow .25s ease, background-color .25s ease;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .button:active {
            transform: scale(.97);
        }

        .button:focus-visible {
            outline: 3px solid #a57348;
            outline-offset: 5px;
        }

        .primary-button {
            box-shadow: 0 13px 28px rgba(90, 47, 73, .23);
        }

        .primary-button:hover {
            box-shadow: 0 18px 32px rgba(90, 47, 73, .28);
        }

        .primary-button.is-opening {
            animation: button-glow .48s ease both;
            overflow: visible;
            z-index: 1;
        }

        .primary-button.is-opening::before,
        .primary-button.is-opening::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 7px;
            height: 13px;
            border-radius: 2px;
            pointer-events: none;
            opacity: 0;
            transform-origin: center;
            animation: confetti-burst .9s cubic-bezier(.18, .72, .22, 1) both;
        }

        .primary-button.is-opening::before {
            background: #d989a5;
            box-shadow:
                -118px -42px 0 0 #f0b6c9, -101px -8px 0 0 #bda2d4, -91px 36px 0 0 #fff,
                -78px 68px 0 0 #c4a674, -67px -66px 0 0 #e7a4bb, -48px 18px 0 0 #d989a5,
                -35px -92px 0 0 #b28c65, -21px 76px 0 0 #c8b4de, 8px -102px 0 0 #fff,
                26px 85px 0 0 #e7a4bb, 42px -75px 0 0 #c8b4de, 58px 45px 0 0 #d8adbd,
                78px -29px 0 0 #c4a674, 94px 31px 0 0 #bb9acf, 112px -3px 0 0 #f0b6c9,
                -108px 19px 0 0 #8ec5c1, -57px 54px 0 0 #f2c879, 69px 72px 0 0 #a9b8e8,
                -14px -61px 0 0 #e7a4bb, 18px 55px 0 0 #fff;
        }

        .primary-button.is-opening::after {
            width: 5px;
            height: 18px;
            border-radius: 50%;
            background: #c8b4de;
            box-shadow:
                -132px -18px 0 0 #aa7952, -116px 25px 0 0 #fff, -94px -79px 0 0 #d8adbd,
                -72px 91px 0 0 #c4a674, -53px -108px 0 0 #bda2d4, -31px 38px 0 0 #8ec5c1,
                4px -117px 0 0 #f2c879, 30px -84px 0 0 #fff, 55px -110px 0 0 #bda2d4,
                73px 94px 0 0 #aa7952, 91px 15px 0 0 #e7a4bb, 111px 56px 0 0 #fff,
                128px -27px 0 0 #c4a674, -88px 56px 0 0 #f0b6c9, 84px -67px 0 0 #a9b8e8;
            animation-delay: .08s;
        }

        .primary-button.is-opening:focus-visible {
            outline-offset: 7px;
        }

        .secondary-button {
            border: 1px solid #b798a9;
            background: transparent;
        }

        .secondary-button:hover {
            background: #f9edf3;
        }

        .panel.is-entering {
            animation: reveal .75s cubic-bezier(.2, .75, .25, 1) both;
        }

        .celebration-heading {
            margin: 0 0 22px;
            font-family: 'Playfair Display', serif;
            font-weight: 500;
            letter-spacing: -.025em;
        }

        .main-message {
            max-width: 620px;
            margin: 0 auto;
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.13rem, 2.5vw, 1.43rem);
            line-height: 1.8;
            white-space: pre-line;
        }

        .closing {
            margin: 27px 0 0;
            font-family: 'Playfair Display', serif;
            font-size: 1.08rem;
            font-style: italic;
        }

        .action-row {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 37px;
        }

        .final-message {
            max-width: 570px;
            margin: 31px auto 0;
            padding: 24px 26px;
            border: 1px solid #ecdbe5;
            border-radius: 22px;
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.08rem, 2.3vw, 1.3rem);
            line-height: 1.7;
        }

        .final-message.is-entering {
            animation: reveal .7s ease both;
        }

        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            border-radius: inherit;
        }

        .particle {
            position: absolute;
            top: -25px;
            left: var(--x);
            color: var(--color);
            font-family: 'DM Sans', sans-serif;
            font-size: var(--size);
            opacity: 0;
            animation: drift var(--duration) ease-in-out var(--delay) infinite;
        }

        .particle.spark {
            animation-name: twinkle;
            top: var(--y);
        }

        @keyframes drift {
            0% {
                opacity: 0;
                transform: translate3d(0, -15px, 0) rotate(0deg);
            }

            15% {
                opacity: .75;
            }

            85% {
                opacity: .65;
            }

            100% {
                opacity: 0;
                transform: translate3d(var(--travel), 650px, 0) rotate(190deg);
            }
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(.6) translateY(6px);
            }

            50% {
                opacity: .7;
                transform: scale(1.1) translateY(-7px);
            }
        }

        @keyframes confetti-burst {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(.35) rotate(0deg);
            }

            12% {
                opacity: .95;
            }

            68% {
                opacity: .82;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) rotate(155deg);
            }
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(18px) scale(.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes button-glow {
            50% {
                transform: scale(1.045);
                box-shadow: 0 0 0 13px rgba(185, 136, 166, .17);
            }
        }

        @media (max-width: 560px) {
            .panel {
                padding: 48px 23px;
            }

            .action-row {
                flex-direction: column;
            }

            .action-row .button {
                width: 100%;
            }

            .main-message {
                line-height: 1.68;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }

            .particle {
                display: none;
            }

            .primary-button.is-opening::before,
            .primary-button.is-opening::after {
                animation: none;
                opacity: .62;
            }
        }
    </style>

    <script>
        const welcome = document.getElementById('welcome-panel');
        const celebration = document.getElementById('celebration-panel');
        const surpriseButton = document.getElementById('surprise-button');
        const nextButton = document.getElementById('next-button');
        const replayButton = document.getElementById('replay-button');
        const finalMessage = document.getElementById('final-message');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        const messages = [
            "Happy birthday, my love. You make my world complete.",
            "You’re the sunshine in my life. Never stop shining.",
            "Your smile is my favorite view. Happy birthday, sweetheart.",
            "Happy birthday to the girl of my dreams.",
            "You light up my world like no one else.",
            "My heart beats for you. Wishing you the happiest birthday.",
            "You’re not just my girlfriend—you’re my everything.",
            "You make love feel easy and beautiful.",
            "Thank you for being you. I love you more each day.",
            "Here’s to a lifetime of birthdays together. I adore you.",
            "Happy birthday to the girl who stole my heart and never gave it back—I wouldn’t want it anywhere else.",
            "You make my whole world brighter just by being in it. Happy birthday, beautiful—today is all about you.",
            "Every day with you feels like a celebration, but today I get to spoil you officially. Happy birthday, my love.",
            "Happy birthday to the most gorgeous, kind-hearted, impossible-to-resist person I know. I’m so lucky you’re mine.",
            "You’re my favorite notification, my best good morning, and my happiest place. Happy birthday, sweetheart.",
            "I didn’t know what I was missing until you. Happy birthday to the girl who feels like home.",
            "You’ve made my life softer, warmer, and a thousand times happier. Happy birthday, my love—thank you for being you.",
            "Happy birthday to the girl with the smile I think about all day. Here’s to many more birthdays by your side.",
            "Falling for you was the best thing that ever happened to me—and I’m still falling. Happy birthday, beautiful.",
            "Happy birthday to my favorite person, my partner in crime, and the only one I’ll let pick the movie tonight.",
            "You deserve the world today and every day. Happy birthday, my love—let me start by giving you the best one yet.",
            "Every love song makes sense now that I have you. Happy birthday, sweetheart."
        ];

        let currentIndex = 0;
        let opening = false;
        let openingTimer;

        function showCurrentMessage() {
            finalMessage.textContent = messages[currentIndex];
            finalMessage.hidden = false;
            finalMessage.classList.remove('is-entering');
            void finalMessage.offsetWidth;
            finalMessage.classList.add('is-entering');
            finalMessage.focus();

            if (currentIndex === messages.length - 1) {
                nextButton.textContent = 'Read Again 💖';
            } else {
                nextButton.textContent = 'Show Next Message 💌';
            }
        }

        surpriseButton.addEventListener('click', () => {
            if (opening) return;
            opening = true;
            surpriseButton.classList.add('is-opening');

            openingTimer = window.setTimeout(() => {
                welcome.hidden = true;
                celebration.hidden = false;
                celebration.classList.add('is-entering');
                surpriseButton.setAttribute('aria-expanded', 'true');
                document.getElementById('celebration-heading').setAttribute('tabindex', '-1');
                document.getElementById('celebration-heading').focus();
                showCurrentMessage();
                opening = false;
            }, reducedMotion.matches ? 0 : 420);
        });

        nextButton.addEventListener('click', () => {
            if (currentIndex < messages.length - 1) {
                currentIndex += 1;
                showCurrentMessage();
            } else {
                currentIndex = 0;
                showCurrentMessage();
            }
        });

        replayButton.addEventListener('click', () => {
            window.clearTimeout(openingTimer);
            currentIndex = 0;
            celebration.hidden = true;
            celebration.classList.remove('is-entering');
            finalMessage.hidden = true;
            finalMessage.classList.remove('is-entering');
            surpriseButton.setAttribute('aria-expanded', 'false');
            surpriseButton.classList.remove('is-opening');
            welcome.hidden = false;
            opening = false;
            nextButton.textContent = 'Show Next Message 💌';
            surpriseButton.focus();
        });
    </script>
</body>

</html>
